<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>polymarket-lab — live equity</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#21262d;--txt:#c9d1d9;--dim:#8b949e;
        --green:#3fb950;--red:#f85149;--blue:#58a6ff;--amber:#d29922}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;
         align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600}
  .dim{color:var(--dim);font-size:12px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
       background:var(--dim);margin-right:6px;vertical-align:middle}
  .wrap{padding:18px 22px;display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .v{font-size:24px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
  .v.small{font-size:18px}
  .pos{color:var(--green)} .neg{color:var(--red)} .muted{color:var(--dim)}
  .box{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);
       border-radius:10px;padding:12px 14px}
  #chart{width:100%;height:300px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase}
  .scroll{max-height:420px;overflow:auto}
  @media(max-width:900px){.wrap{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header>
  <h1>polymarket-lab · live equity</h1>
  <span class="dim"><span class="dot" id="live"></span><span id="livetxt">connecting…</span></span>
  <span class="dim" id="stamp"></span>
</header>
<div class="wrap">
  <div class="card"><div class="k">Equity (realised + open)</div><div class="v" id="eq">—</div></div>
  <div class="card"><div class="k">Realised</div><div class="v small" id="rz">—</div></div>
  <div class="card"><div class="k">Open, marked to market</div><div class="v small" id="un">—</div></div>
  <div class="card"><div class="k">Positions</div><div class="v small" id="pos">—</div></div>
  <div class="box">
    <div id="chart"></div>
    <div class="dim" style="margin-top:6px">
      <span style="color:var(--green)">━</span> equity, sampled once a minute &nbsp;
      <span style="color:var(--amber)">┈</span> realised only
    </div>
  </div>
  <div class="box">
    <div class="scroll"><table><thead><tr><th>market</th><th class="right">entry</th><th class="right">now</th>
      <th class="right">move</th><th class="right">P&amp;L</th><th class="right">resolves</th></tr></thead>
    <tbody id="rows"></tbody></table></div>
  </div>
</div>
<script>
const STAKE = 20.0;
const SOURCE = "dashboard_data.json";
let D = null;

const money = v => (v>=0?"+":"−")+"$"+Math.abs(v).toFixed(2);
const pct   = v => (v>=0?"+":"−")+(Math.abs(v)*100).toFixed(2)+"%";

function svgChart(el, hist, realized){
  const W = Math.max(320, el.clientWidth || 1000), H = Math.max(200, el.clientHeight || 300);
  if(!hist || hist.length < 2){
    el.innerHTML = '<div class="dim" style="padding:18px">collecting history — live line updates every 2 s, points every minute</div>';
    return;
  }
  const pad = {l:64,r:16,t:14,b:26};
  const t0 = hist[0].ts, t1 = hist[hist.length-1].ts;
  let lo = Math.min(0, realized), hi = Math.max(0, realized);
  for(const p of hist){ lo = Math.min(lo, p.equity); hi = Math.max(hi, p.equity); }
  if(hi - lo < 1) { hi = lo + 1; }
  const X = t => pad.l + (W-pad.l-pad.r) * (t1>t0 ? (t-t0)/(t1-t0) : 0);
  const Y = v => pad.t + (H-pad.t-pad.b) * (1 - (v-lo)/(hi-lo));
  let o = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let k=0;k<=4;k++){
    const v = lo + (hi-lo)*k/4, y = Y(v).toFixed(1);
    o += `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#21262d"/>`;
    o += `<text x="8" y="${+y+4}" fill="#8b949e" font-size="11" font-family="ui-sans-serif">$${v.toFixed(0)}</text>`;
  }
  const ry = Y(realized).toFixed(1);
  o += `<line x1="${pad.l}" y1="${ry}" x2="${W-pad.r}" y2="${ry}" stroke="#d29922" stroke-dasharray="4 4" opacity="0.7"/>`;
  const pts = hist.map(p => `${X(p.ts).toFixed(1)},${Y(p.equity).toFixed(1)}`).join(" ");
  o += `<polyline points="${pts}" fill="none" stroke="#3fb950" stroke-width="2"/>`;
  const last = hist[hist.length-1];
  o += `<circle cx="${X(last.ts).toFixed(1)}" cy="${Y(last.equity).toFixed(1)}" r="3.5" fill="#3fb950"/>`;
  const fmt = t => new Date(t*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  o += `<text x="${pad.l}" y="${H-8}" fill="#8b949e" font-size="11">${fmt(t0)}</text>`;
  o += `<text x="${W-pad.r-40}" y="${H-8}" fill="#8b949e" font-size="11">${fmt(t1)}</text>`;
  o += "</svg>";
  el.innerHTML = o;
}

function render(d){
  const eq = document.getElementById("eq");
  eq.textContent = money(d.equity);
  eq.className = "v " + (d.equity >= 0 ? "pos" : "neg");
  document.getElementById("rz").textContent = money(d.realized);
  const un = document.getElementById("un");
  un.textContent = money(d.unrealized);
  un.className = "v small " + (d.unrealized >= 0 ? "pos" : "neg");
  document.getElementById("pos").textContent = d.open + " open · " + d.settled + " settled";
  document.getElementById("stamp").textContent =
    "updated " + new Date(d.ts*1000).toLocaleTimeString();

  const tb = document.getElementById("rows");
  tb.innerHTML = "";
  const list = (d.positions || []);
  if(!list.length){
    tb.innerHTML = '<tr><td colspan="6" class="muted">no open positions with a live price</td></tr>';
  }
  for(const p of list){
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${p.q}</td>
      <td class="right">${p.entry.toFixed(3)}</td>
      <td class="right">${p.mark.toFixed(3)}</td>
      <td class="right ${p.pnl_pct>=0?'pos':'neg'}">${pct(p.pnl_pct)}</td>
      <td class="right ${p.pnl>=0?'pos':'neg'}">${money(p.pnl)}</td>
      <td class="right muted">${p.end_date}</td>`;
    tb.appendChild(tr);
  }
  svgChart(document.getElementById("chart"), d.history, d.realized);
}

async function tick(){
  try{
    const r = await fetch(SOURCE, {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    D = d;
    document.getElementById("live").style.background = "var(--green)";
    document.getElementById("livetxt").textContent = "live";
    render(d);
  }catch(e){
    document.getElementById("live").style.background = "var(--red)";
    document.getElementById("livetxt").textContent = "offline";
  }
}
tick();
setInterval(tick, 30000);
window.addEventListener("resize", () => { if(D) render(D); });
</script></body></html>
